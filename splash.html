<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>DeepSeek Harness</title>
  <style>
    :root { --bg:#0b0e14; --fg:#e6e9ef; --muted:#8b93a7; --accent:#4d6bfe; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    }
    .logo { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
    .logo span { color: var(--accent); }
    .spin {
      width: 38px; height: 38px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent);
      animation: r 1s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    .tip { color: var(--muted); font-size: 13px; }
    .err { display: none; max-width: 520px; text-align: center; color: #ffb4b4; line-height: 1.7; }
    button {
      margin-top: 10px; padding: 8px 20px; border: 1px solid var(--accent);
      background: transparent; color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: rgba(77,107,254,.12); }
    body.error .spin, body.error .tip { display: none; }
    body.error .err { display: block; }
  </style>
</head>
<body>
  <div class="logo">DeepSeek <span>Harness</span> · 桌面版</div>
  <div class="spin"></div>
  <div class="tip" id="tip">正在启动本地服务并连接 Web UI …</div>
  <div class="err" id="err">
    本地服务启动失败。<br/>
    请检查 dsh 安装、API Key 与端口占用，然后点击重试。<br/>
    <button id="retry">重试</button>
  </div>
  <script>
    if (location.hash === '#error') document.body.classList.add('error');
    const tip = document.getElementById('tip');
    if (window.harness && window.harness.onStatusText) {
      window.harness.onStatusText((text) => { if (tip) tip.textContent = text; });
    }
    const retry = document.getElementById('retry');
    if (retry) retry.onclick = async () => {
      document.body.classList.remove('error');
      if (tip) tip.textContent = '正在重新启动本地服务…';
      const ok = await window.harness.restart();
      if (!ok) document.body.classList.add('error');
    };
  </script>
</body>
</html>
